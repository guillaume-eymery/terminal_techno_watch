<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Port Technology Watch</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23163a70'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <span class="brand">Port Technology Watch</span>
    <div class="bar__right">
      <span class="bar__updated" id="updated"></span>
      <div class="menu-wrap">
        <button class="icon-btn" id="menuBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Manage data" title="Manage data">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>
        <div class="menu" id="menu" role="menu" hidden>
          <label class="menu__item" role="menuitem">
            Import JSON file…
            <input type="file" id="fileInput" accept=".json,application/json" multiple hidden>
          </label>
          <button class="menu__item" role="menuitem" data-action="context">Download agent context</button>
          <button class="menu__item" role="menuitem" data-action="backup">Download backup</button>
          <hr class="menu__sep">
          <button class="menu__item menu__item--danger" role="menuitem" data-action="reset">Reset data…</button>
        </div>
      </div>
    </div>
  </header>

  <p class="demo-note" id="demoNote" hidden>Demo data: the articles and links are fictitious.</p>

  <main class="layout">
    <aside class="panel" id="panel">
      <div id="listView">
        <section class="edition" id="edition"></section>

        <div class="tools">
          <input class="search" type="search" id="search" placeholder="Search all weeks" autocomplete="off" aria-label="Search">
          <select class="select" id="topic" aria-label="Topic"></select>
        </div>
        <div class="levels" id="levels" role="group" aria-label="Filter by importance"></div>
        <div class="site-bar" id="siteBar" hidden></div>

        <div id="list"></div>
      </div>

      <article class="detail" id="detailView" hidden></article>
    </aside>

    <div class="map" id="map" aria-label="Map"></div>
  </main>

  <div class="dropzone" id="dropzone"><p>Drop the JSON file to import it</p></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Project database (generated by scripts/techwatch.py) -->
  <script src="../data/history.js"></script>
  <script src="app.js"></script>
</body>
</html>
